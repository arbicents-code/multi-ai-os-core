schema_version: "1.0.0"
registry_id: "BENCHMARK-REGISTRY-2026-10-28"
governance_status: "PREREGISTERED_GATE_2"
evidence_policy: "ZERO_AI_SELF_SCORING_HELD_OUT_DETERMINISTIC_ORACLE_ONLY"
experimental_controls:
  repeats_per_task: 3
  max_auto_retries: 2
  wall_clock_timeout_minutes: 15
  incremental_budget_cap_gbp: 40.00
  operator_rate_gbp_per_minute: 1.00
  min_tcvso_improvement_for_multi_agent: 0.15

workloads:
