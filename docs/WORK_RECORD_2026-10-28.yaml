DECISIONS:
  - decision_id: "DEC-01"
    chosen: "Unified Repository Adapter (./AGENTS.md authoritative + ./CLAUDE.md @AGENTS.md import + .agents/skills/ symlinked/junctioned to .claude/skills/)"
    rejected: "Duplicating instructions across separate CLAUDE.md, AGENTS.md, and GEMINI.md files"
    rationale: "Prevents Claude Code from ignoring AGENTS.md when CLAUDE.md exists and avoids rule drift (P1-07)."
    status: "Accepted (Desk-Verified & Implemented)"
  - decision_id: "DEC-02"
    chosen: "Single-Agent + Deterministic Oracles (Config 1) for routine tasks; Two-Platform Shared Git Worktrees (Config 3 & 5) for complex software engineering and bitemporal state analytical pipelines"
    rejected: "Three-Platform Central Orchestrator and Experimental Agent Teams"
    rationale: "3-platform swarms increase token usage up to 7x and more than double modeled TCVSO (£12.42-£14.90 vs £4.60-£5.76) while violating consumer ToS boundaries (P0-05, P1-06, P1-11)."
    status: "Accepted & Locked (2026-10-29)"
  - decision_id: "DEC-03"
    chosen: "Gate 0 Operator Lock: OD-1=1B (Workloads A=45%, B=35%, C=20%), OD-2=2C (Subscription-First + Zero Global API Keys + useG1Credits=false), OD-3=3B (Native Windows 11 NTFS + PowerShell + Python Hooks), OD-4=4B (£0 Overage Subscription-Quota Baseline), OD-5=5C (workspace-write/acceptEdits/proceed-in-sandbox + hard deny rules + human gate on external/destructive actions), plus CD-1..CD-6"
    rejected: "Equal-weight un-staged rollout (1A), Global API key exports (2B), WSL2 /mnt/c/ 9P mount (3A), Upfront £40 paid API spend (4A), Permissive --yolo/Turbo or per-edit manual prompts (5A/5B)"
